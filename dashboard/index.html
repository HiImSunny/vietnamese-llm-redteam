<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>VN Red-Team</title></head><body bgcolor="#0b0e14" text="#e2e8f0" style="font-family:system-ui;max-width:1200px;margin:0 auto;padding:20px"><div id="e" style="display:none;text-align:center;padding:60px"><h3>No Data</h3></div><div id="d"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px"><div><h1 style="font-size:20px;margin:0">VN LLM Red-Teaming</h1><small style="color:#8892a4">Asia Track - Technical AI Safety</small></div><span id="s" style="font-size:12px;background:#1a2030;padding:4px 10px;border-radius:4px">Loading</span></div><div id="h" style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px"><div style="background:#141922;border:1px solid #252d3e;border-radius:6px;padding:16px"><h3 style="margin:0 0 12px 0;font-size:13px;color:#8892a4">By Model</h3><div id="mc"></div></div><div style="background:#141922;border:1px solid #252d3e;border-radius:6px;padding:16px"><h3 style="margin:0 0 12px 0;font-size:13px;color:#8892a4">By Attack</h3><div id="ac"></div></div></div><div style="background:#141922;border:1px solid #252d3e;border-radius:6px;padding:16px"><h3 style="margin:0 0 12px 0;font-size:13px;color:#8892a4">Results</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="border-bottom:1px solid #252d3e;color:#5a6478;font-size:11px;text-transform:uppercase"><th style="text-align:left;padding:8px">ID</th><th style="text-align:left;padding:8px">Prompt</th><th style="text-align:left;padding:8px">Model</th><th style="text-align:left;padding:8px">Attack</th><th style="text-align:left;padding:8px">Cat</th><th style="text-align:left;padding:8px">Verdict</th><th style="text-align:left;padding:8px">Response</th></tr></thead><tbody id="tb"></tbody></table></div></div></div><script>let a=[];async function init(){const r=await fetch('/api/results');a=await r.json();if(a.length===0){document.getElementById('e').style.display='block';return}document.getElementById('e').style.display='none';render()}function render(){const m=[...new Set(a.map(x=>x.model_display?x.model_display:x.model))];document.getElementById('s').textContent=m.length+'mdl '+a.length+'tst';const j=a.filter(x=>x.verdict==='JAILBROKEN').length;const f=a.filter(x=>x.verdict==='REFUSED').length;document.getElementById('h').innerHTML='<div style="flex:1"><div style="font-size:11px;color:#5a6478;text-transform:uppercase">Tests</div><div style="font-size:32px;font-weight:800;color:#38bdf8">'+a.length+'</div></div><div style="flex:1"><div style="font-size:11px;color:#5a6478;text-transform:uppercase">Jailbroken</div><div style="font-size:32px;font-weight:800;color:#f87171">'+j+'<span style="font-size:14px;color:#8892a4;font-weight:400">('+(j>0?(j/a.length*100).toFixed(1):0)+'%)</span></div></div><div style="flex:1"><div style="font-size:11px;color:#5a6478;text-transform:uppercase">Refused</div><div style="font-size:32px;font-weight:800;color:#34d399">'+f+'</div></div>';drawModel();drawAttack();drawTable()}function drawModel(){const g={};a.forEach(z=>{let n=z.model_display?z.model_display:z.model?z.model:'?';if(!g[n])g[n]=0;if(z.verdict==='JAILBROKEN')g[n]++});const e=Object.entries(g).sort((p,q)=>q[1]-p[1]);document.getElementById('mc').innerHTML='';e.forEach(([n,c])=>{let tot=a.filter(z=>{let nm=z.model_display?z.model_display:z.model;return nm===n}).length;let pct=tot>0?((c/tot*100).toFixed(0)):0;document.getElementById('mc').innerHTML+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div style="width:100px;font-size:12px;color:#8892a4;text-align:right">'+n+'</div><div style="flex:1;height:20px;background:#1a2030;border-radius:4px;overflow:hidden"><div style="height:100%;background:#f87171;width:'+pct+'%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding:0 4px;font-size:10px;color:#450a0a">'+(pct>8?pct+'%':'')+'</div></div></div>'})}function drawAttack(){const g={};a.forEach(z=>{let t=z.attack_type?z.attack_type:'?';if(t.substring(0,8)==='roleplay')t='roleplay';if(!g[t])g[t]=0;if(z.verdict==='JAILBROKEN')g[t]++});const e=Object.entries(g);const lb={direct:'Direct',multiturn:'Multi-Turn',crosslingual:'Cross-Lingual',roleplay:'Role-Play'};document.getElementById('ac').innerHTML='';e.forEach(([t,c])=>{let tot=a.filter(z=>{let v=z.attack_type?z.attack_type:'?';if(v.substring(0,8)==='roleplay')v='roleplay';return v===t}).length;let pct=tot>0?((c/tot*100).toFixed(0)):0;document.getElementById('ac').innerHTML+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div style="width:100px;font-size:12px;color:#8892a4;text-align:right">'+(lb[t]?lb[t]:t)+'</div><div style="flex:1;height:20px;background:#1a2030;border-radius:4px;overflow:hidden"><div style="height:100%;background:#f87171;width:'+pct+'%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding:0 4px;font-size:10px;color:#450a0a">'+(pct>8?pct+'%':'')+'</div></div></div>'})}function drawTable(){const tb=document.getElementById('tb');tb.innerHTML=a.slice(0,100).map(z=>{let pv=z.response?z.response.substring(0,60):(z.error?z.error:'N/A');if(z.response.length>60)pv+='...';let vc='background:#5a6478';if(z.verdict==='JAILBROKEN')vc='background:#f87171;color:#fff';else if(z.verdict==='REFUSED')vc='background:#34d399;color:#022c22';let pid=z.prompt_id?z.prompt_id:'-';let pt=z.prompt_text?z.prompt_text:'';if(pt.length>40)pt=pt.substring(0,40)+'..';let md=z.model_display?z.model_display:z.model?z.model:'-';let at=z.attack_type?z.attack_type:'-';let ct=z.category?z.category:'-';let vd=z.verdict?z.verdict:'N/A';return'<tr style="border-bottom:1px solid #252d3e"><td style="padding:8px">'+pid+'</td><td style="padding:8px">'+pt+'</td><td style="padding:8px">'+md+'</td><td style="padding:8px">'+at+'</td><td style="padding:8px">'+ct+'</td><td style="padding:8px"><span style="display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;'+vc+'">'+vd+'</span></td><td style="padding:8px;font-size:11px">'+pv+'</td></tr>'}).join('')}init()</script></body></html>
